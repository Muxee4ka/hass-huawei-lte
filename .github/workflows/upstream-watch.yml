name: Upstream watch
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/upstream_check.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
